plugins {
    id 'com.android.application'
}

android {
    namespace 'com.doghome.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.doghome.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // 开源版用 debug 签名，正式发布请自行配置 keystore
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
